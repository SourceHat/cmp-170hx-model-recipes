network:
  host: '@HOST@'
  port: '@PORT@'
  disable_auth: true
  allowed_origins: []
  disable_fetch_requests: true
  api_servers:
  - oai
  sse_ping_interval: 15
logging:
  log_prompt: false
  log_requests: false
  log_live_status: false
model:
  model_dir: '@MODEL_PARENT@'
  model_name: apex-flash-1-abliterated-exl3-4bit-spark
  backend: exllamav3
  max_seq_len: 524288
  cache_size: 1374976
  cache_mode: Q8
  max_batch_size: 4
  chunk_size: 512
  tensor_parallel: true
  tensor_parallel_backend: nccl
  gpu_split_auto: true
  autosplit_reserve:
  - 2560
  - 2336
  - 2848
  vision: false
  warmup: true
  output_chunking: true
  inline_model_loading: false
  recurrent_checkpoint_interval: 2048
  recurrent_checkpoint_interval_pp: 32768
draft_model:
  draft_mode: mtp
  draft_cache_mode: Q8
  draft_num_tokens: 1
  dynamic_draft: false
  draft_gpu_split:
  - 0
  - 0
  - 62.0
sampling: {}
memory:
  sysmem_kv_cache: 0
  sysmem_recurrent_cache: 16384
