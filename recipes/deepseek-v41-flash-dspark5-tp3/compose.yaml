services:
  deepseek:
    build:
      context: ../..
      dockerfile: runtimes/deepseek/Dockerfile
    gpus: all
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
      nofile: 1048576
    environment:
      NCCL_P2P_DISABLE: '1'
      MAX_JOBS: '1'
      VLLM_USE_V2_MODEL_RUNNER: '1'
      VLLM_PLUGINS: vllm_exl3
      VLLM_BATCH_INVARIANT: '1'
      MESHIFY_V41_MTP_SINGLE_TOKEN_MARLIN: '1'
      MESHIFY_V41_ENGRAM_RAM_CACHE_MIB: '64'
      CUDA_VISIBLE_DEVICES: ${DEVICES:?Select three GPU ordinals or UUIDs}
      MESHIFY_V41_ENGRAM_DIRECTORY: /engram
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    ports:
    - target: 8000
      published: ${PORT:-8000}
      host_ip: ${BIND_ADDRESS:-127.0.0.1}
      protocol: tcp
    volumes:
    - ${MODEL_DIR:?Set MODEL_DIR to prepared TP3 weights}:/models/main:ro
    - ${SOURCE_MODEL_DIR:?Set SOURCE_MODEL_DIR to the original checkpoint}:${SOURCE_MODEL_DIR:?Set
      SOURCE_MODEL_DIR to the original checkpoint}:ro
    - ${ENGRAM_DIR:?Set ENGRAM_DIR to prepared NVMe tables}:/engram:ro
    command:
    - --model
    - /models/main
    - --tokenizer
    - /models/main
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --served-model-name
    - deepseek-v4.1-flash
    - --tensor-parallel-size
    - '3'
    - --pipeline-parallel-size
    - '1'
    - --distributed-executor-backend
    - mp
    - --dtype
    - bfloat16
    - --quantization
    - exl3
    - --kv-cache-dtype
    - fp8
    - --gpu-memory-utilization
    - '0.98391'
    - --max-model-len
    - '524288'
    - --max-num-seqs
    - '4'
    - --max-num-batched-tokens
    - '1280'
    - --enable-chunked-prefill
    - --enable-prefix-caching
    - --enforce-eager
    - --disable-custom-all-reduce
    - --enable-auto-tool-choice
    - --tool-call-parser
    - deepseek_v41
    - --reasoning-parser
    - deepseek_v41
    - --prefix-match-unit
    - '8'
    - --kv-offloading-size
    - '8.0'
    - --kv-offloading-backend
    - native
    - --speculative-config
    - '{"method":"dspark","num_speculative_tokens":5,"draft_tensor_parallel_size":3}'
    stop_grace_period: 60s
